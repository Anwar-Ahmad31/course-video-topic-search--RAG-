<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Course Video Topic Search — RAG Knowledge Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #0f141c;
      --bg-card: #151b26;
      --bg-sidebar: #0c1017;
      --bg-input: #121822;
      --border: #222b3a;
      --border-hover: #3b475c;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
      --user-bubble: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --bot-bubble: #151b26;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222d3d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #324157; }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ══════════════════════════════════════════════════════════════════
       SIDEBAR & MOBILE DRAWER
    ══════════════════════════════════════════════════════════════════ */
    .sidebar {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      z-index: 50;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      overflow: hidden;
      border-right: none;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar-brand {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-meta h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-meta p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 500;
    }

    .sidebar-close-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      font-feature-settings: "tnum";
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-weight: 500;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .control-row:last-child {
      border-bottom: none;
    }

    .control-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .range-input {
      width: 85px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      display: inline-block;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border);
      transition: var(--transition);
      border-radius: 20px;
    }

    .toggle-slider::before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: var(--transition);
      border-radius: 50%;
    }

    .toggle-switch input:checked + .toggle-slider {
      background-color: var(--accent);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }

    .prompt-presets {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }

    .preset-button:hover, .preset-button:active {
      background: var(--border);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .btn-reset {
      width: 100%;
      padding: 10px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-sm);
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.16);
    }

    /* ══════════════════════════════════════════════════════════════════
       MAIN STAGE
    ══════════════════════════════════════════════════════════════════ */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      background: var(--bg-primary);
    }

    .top-navbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      flex-shrink: 0;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
    }

    .icon-button:hover, .icon-button:active {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .nav-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    /* ══════════════════════════════════════════════════════════════════
       CHAT VIEWPORT
    ══════════════════════════════════════════════════════════════════ */
    .chat-scrollview {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .conversation-container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-panel {
      text-align: center;
      padding: 40px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .welcome-logo-badge {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 10px 24px var(--accent-glow);
    }

    .welcome-panel h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .welcome-panel p {
      font-size: 13.5px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.5;
    }

    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 720px;
      width: 100%;
      margin-top: 6px;
    }

    .cap-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
      text-align: left;
    }

    .cap-card h4 {
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .cap-card p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* ══════════════════════════════════════════════════════════════════
       MESSAGES
    ══════════════════════════════════════════════════════════════════ */
    .message-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-row.user .avatar-icon {
      background: var(--accent);
      color: #ffffff;
    }

    .message-row.bot .avatar-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .message-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 82%;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .message-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .message-bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .message-bubble pre {
      background: #080a0e;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message-bubble pre code {
      background: none;
      padding: 0;
      border: none;
      font-size: 12px;
    }

    .meta-timestamp {
      font-size: 10.5px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .message-row.user .meta-timestamp {
      text-align: right;
    }

    /* ══════════════════════════════════════════════════════════════════
       MARKDOWN STYLING INSIDE BUBBLE
    ══════════════════════════════════════════════════════════════════ */
    .message-bubble h2, .message-bubble h3, .message-bubble .md-h2, .message-bubble .md-h3 {
      font-size: 14.5px;
      font-weight: 700;
      color: #93c5fd;
      margin: 12px 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(147, 197, 253, 0.15);
      letter-spacing: -0.2px;
    }
    .message-bubble h2:first-child, .message-bubble h3:first-child,
    .message-bubble .md-h2:first-child, .message-bubble .md-h3:first-child {
      margin-top: 0;
    }
    .message-bubble p {
      margin-bottom: 6px;
      line-height: 1.55;
    }
    .message-bubble p:last-child {
      margin-bottom: 0;
    }
    .message-bubble ul {
      margin: 6px 0 8px 18px;
    }
    .message-bubble li {
      margin-bottom: 4px;
      line-height: 1.5;
    }

    /* ══════════════════════════════════════════════════════════════════
       RELATED VIDEO LECTURES PANEL
    ══════════════════════════════════════════════════════════════════ */
    .video-panel-wrapper {
      margin-top: 12px;
      width: 100%;
    }

    .video-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.28);
      border-radius: var(--radius-sm);
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }
    .video-panel-header:hover {
      border-color: rgba(59, 130, 246, 0.55);
      background: rgba(30, 58, 138, 0.2);
    }

    .video-header-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .video-play-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    }

    .video-header-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }

    .video-header-count {
      font-size: 11px;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .video-toggle-indicator {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }
    .video-panel-wrapper.open .video-toggle-indicator {
      transform: rotate(180deg);
    }

    .video-cards-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .video-panel-wrapper:not(.open) .video-cards-list {
      display: none;
    }

    .video-lecture-card {
      background: #0f141d;
      border: 1px solid #1e293b;
      border-left: 3px solid #3b82f6;
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      transition: var(--transition);
    }
    .video-lecture-card:hover {
      border-color: #334155;
      border-left-color: #60a5fa;
      background: #141b27;
    }

    .video-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .video-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .mod-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.2px;
    }

    .mod-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .match-tag {
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-weight: 600;
      white-space: nowrap;
    }

    .video-time-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #cbd5e1;
    }

    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 500;
    }

    .video-snippet-box {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.45;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      font-style: italic;
    }

    /* ══════════════════════════════════════════════════════════════════
       TYPING INDICATOR
    ══════════════════════════════════════════════════════════════════ */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-circle {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-circle:nth-child(2) { animation-delay: 0.2s; }
    .typing-circle:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ══════════════════════════════════════════════════════════════════
       INPUT DOCK
    ══════════════════════════════════════════════════════════════════ */
    .dock-container {
      padding: 12px 16px 14px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dock-form {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      transition: var(--transition);
      display: flex;
      align-items: flex-end;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      line-height: 1.45;
      max-height: 120px;
    }

    .chat-textarea::placeholder {
      color: var(--text-muted);
    }

    .btn-send {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
      font-size: 15px;
    }

    .btn-send:hover {
      background: var(--accent-hover);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dock-footnote {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* ══════════════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS (Mobile & Tablet)
    ══════════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        height: 100%;
        height: 100dvh;
        width: 82%;
        max-width: 320px;
        min-width: unset;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
        transform: translateX(-100%);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sidebar.open-drawer {
        transform: translateX(0);
      }

      .sidebar.collapsed {
        width: 82%;
        min-width: unset;
        transform: translateX(-100%);
      }

      .sidebar-close-btn {
        display: flex;
      }

      .capabilities-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .message-body {
        max-width: 90%;
      }

      .dock-container {
        padding: 10px 12px 12px;
      }

      .dock-footnote {
        display: none;
      }

      .chat-scrollview {
        padding: 16px 12px;
      }

      .welcome-panel {
        padding: 24px 10px;
      }

      .welcome-panel h2 {
        font-size: 19px;
      }

      .nav-title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- MOBILE OVERLAY BACKDROP -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-group">
          <div class="brand-logo">&#9654;</div>
          <div class="brand-meta">
            <h1>Video Topic Search</h1>
            <p>52 Lecture Modules Indexed</p>
          </div>
        </div>
        <button class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Close Sidebar">&times;</button>
      </div>

      <div class="sidebar-content">
        <section>
          <div class="sidebar-section-title">Knowledge Base Telemetry</div>
          <div class="stats-container">
            <div class="stat-box">
              <div class="stat-value" id="val-modules">--</div>
              <div class="stat-label">Modules</div>
            </div>
            <div class="stat-box">
              <div class="stat-value" id="val-chunks">--</div>
              <div class="stat-label">Chunks</div>
            </div>
          </div>
        </section>

        <section>
          <div class="sidebar-section-title">Retrieval Controls</div>
          <div class="control-row">
            <span class="control-label">Search Depth (Top K)</span>
            <input type="range" class="range-input" id="cfg-topk" min="1" max="8" value="4" />
            <span class="control-label" id="val-topk" style="width: 20px; text-align: right;">4</span>
          </div>
          <div class="control-row">
            <span class="control-label">Display Citations</span>
            <label class="toggle-switch">
              <input type="checkbox" id="cfg-sources" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="control-row">
            <span class="control-label">Transcript Snippets</span>
            <label class="toggle-switch">
              <input type="checkbox" id="cfg-preview" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </section>

        <section>
          <div class="sidebar-section-title">Recommended Inquiries</div>
          <div class="prompt-presets" id="preset-list"></div>
        </section>
      </div>

      <div class="sidebar-footer">
        <button class="btn-reset" onclick="resetConversation()">Clear Conversation History</button>
      </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <main class="main-stage">
      <header class="top-navbar">
        <div class="nav-left">
          <button class="icon-button" onclick="toggleSidebar()" aria-label="Toggle Sidebar">&#9776;</button>
          <span class="nav-title">Course Video Topic Search — RAG Engine</span>
        </div>
        <div class="nav-right">
          <div class="status-badge">
            <span class="pulse-dot" id="system-dot"></span>
            <span id="system-status">Online</span>
          </div>
        </div>
      </header>

      <div class="chat-scrollview" id="chat-viewport">
        <div class="conversation-container" id="conversation-stage">
          <!-- Dynamic Conversation Stream -->
        </div>
      </div>

      <div class="dock-container">
        <div class="dock-form">
          <div class="input-wrapper">
            <textarea
              id="prompt-input"
              class="chat-textarea"
              rows="1"
              placeholder="Ask an inquiry regarding Python..."
              onkeydown="handleKeyNavigation(event)"
            ></textarea>
          </div>
          <button class="btn-send" id="submit-btn" onclick="submitQuery()" aria-label="Submit Question">&#10148;</button>
        </div>
        <div class="dock-footnote">
          Press <b>Enter</b> to transmit &bull; <b>Shift + Enter</b> for line wrap
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let isProcessing = false;

    const PRESET_INQUIRIES = [
      "What is set and tuple?",
      "What distinguishes a list from a tuple?",
      "How does recursion work with base cases?",
      "What are lambda functions in Python?",
      "How does exception handling and try-except work?",
      "What is the Kaun Banega Crorepati (KBC) exercise?"
    ];

    document.addEventListener("DOMContentLoaded", () => {
      fetchCorpusTelemetry();
      renderPresetInquiries();
      mountWelcomeView();
      bindInputDynamicResize(document.getElementById("prompt-input"));

      document.getElementById("cfg-topk").addEventListener("input", (e) => {
        document.getElementById("val-topk").textContent = e.target.value;
      });
    });

    async function fetchCorpusTelemetry() {
      try {
        const response = await fetch(`${API_BASE}/corpus/stats`);
        const data = await response.json();
        document.getElementById("val-modules").textContent = data.total_videos || "--";
        document.getElementById("val-chunks").textContent = data.total_chunks || "--";
        updateSystemHealth(true);
      } catch {
        updateSystemHealth(false);
      }
    }

    function updateSystemHealth(isHealthy) {
      const dot = document.getElementById("system-dot");
      const label = document.getElementById("system-status");
      if (isHealthy) {
        dot.style.background = "var(--success)";
        dot.style.boxShadow = "0 0 8px rgba(16, 185, 129, 0.5)";
        label.textContent = "Online";
      } else {
        dot.style.background = "var(--danger)";
        dot.style.boxShadow = "0 0 8px rgba(239, 68, 68, 0.5)";
        label.textContent = "Offline";
      }
    }

    function mountWelcomeView() {
      const stage = document.getElementById("conversation-stage");
      stage.innerHTML = `
        <div class="welcome-panel">
          <div class="welcome-logo-badge">&#9654;</div>
          <h2>Course Video Topic Search</h2>
          <p>Instant, direct explanations and exact second-by-second video citations across 52 Python lecture modules.</p>
          <div class="capabilities-grid">
            <div class="cap-card">
              <h4>Direct & Simple</h4>
              <p>Crisp explanations focused on key concepts without unnecessary filler or bloated examples.</p>
            </div>
            <div class="cap-card">
              <h4>Exact Video Timestamps</h4>
              <p>Direct module numbers and exact start/end second intervals for every topic.</p>
            </div>
            <div class="cap-card">
              <h4>Multi-Topic Queries</h4>
              <p>Handles compound questions (e.g., 'What is set and tuple?') with balanced coverage.</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderPresetInquiries() {
      const list = document.getElementById("preset-list");
      list.innerHTML = PRESET_INQUIRIES.map((item) => `
        <button class="preset-button" onclick="executePreset('${item.replace(/'/g, "\\'")}')">
          <span>&rsaquo;</span> ${item}
        </button>
      `).join("");
    }

    function executePreset(inquiry) {
      document.getElementById("prompt-input").value = inquiry;
      if (window.innerWidth <= 768) {
        closeSidebar();
      }
      submitQuery();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const isMobile = window.innerWidth <= 768;

      if (isMobile) {
        sidebar.classList.toggle("open-drawer");
        overlay.classList.toggle("active");
      } else {
        sidebar.classList.toggle("collapsed");
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      sidebar.classList.remove("open-drawer");
      overlay.classList.remove("active");
    }

    function resetConversation() {
      mountWelcomeView();
      if (window.innerWidth <= 768) {
        closeSidebar();
      }
    }

    async function submitQuery() {
      const input = document.getElementById("prompt-input");
      const query = input.value.trim();
      if (!query || isProcessing) return;

      isProcessing = true;
      input.value = "";
      input.style.height = "auto";
      document.getElementById("submit-btn").disabled = true;

      const welcome = document.querySelector(".welcome-panel");
      if (welcome) welcome.remove();

      const stage = document.getElementById("conversation-stage");
      stage.innerHTML += renderMessageRow("user", query);

      const placeholderId = `loading-${Date.now()}`;
      stage.innerHTML += `
        <div class="message-row bot" id="${placeholderId}">
          <div class="avatar-icon">&#955;</div>
          <div class="message-body">
            <div class="message-bubble">
              <div class="typing-indicator">
                <div class="typing-circle"></div>
                <div class="typing-circle"></div>
                <div class="typing-circle"></div>
              </div>
            </div>
          </div>
        </div>
      `;
      autoScrollToBottom();

      try {
        const topK = parseInt(document.getElementById("cfg-topk").value, 10);
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: query, top_k: topK })
        });
        const payload = await res.json();

        const indicator = document.getElementById(placeholderId);
        if (indicator) indicator.remove();

        const showCitations = document.getElementById("cfg-sources").checked;
        const showPreview = document.getElementById("cfg-preview").checked;
        stage.innerHTML += renderMessageRow("bot", payload.answer, showCitations ? payload.sources : null, showPreview);
        updateSystemHealth(true);
      } catch (err) {
        const indicator = document.getElementById(placeholderId);
        if (indicator) indicator.remove();
        stage.innerHTML += renderMessageRow("bot", "Unable to complete request. Please verify network connectivity to the knowledge service.");
        updateSystemHealth(false);
      }

      autoScrollToBottom();
      isProcessing = false;
      document.getElementById("submit-btn").disabled = false;
      input.focus();
    }

    function renderMessageRow(role, content, sources, showPreview) {
      const timestamp = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const avatar = role === "user" ? "U" : "&#9654;";

      let formatted = escapeHTML(content);
      // Code blocks
      formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, "<pre><code class='$1'>$2</code></pre>");
      // Inline code
      formatted = formatted.replace(/`([^`]+)`/g, "<code>$1</code>");
      // Headings
      formatted = formatted.replace(/^### (.*$)/gim, "<h4 class='md-h3'>$1</h4>");
      formatted = formatted.replace(/^## (.*$)/gim, "<h3 class='md-h2'>$1</h3>");
      formatted = formatted.replace(/^# (.*$)/gim, "<h2 class='md-h2'>$1</h2>");
      // Bold
      formatted = formatted.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // Lists
      formatted = formatted.replace(/^\s*[-*]\s+(.*$)/gim, "<li>$1</li>");
      formatted = formatted.replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>");
      // Line breaks
      formatted = formatted.replace(/\n\n/g, "<br><br>").replace(/\n/g, "<br>");

      let citationsHTML = "";
      if (sources && sources.length > 0) {
        const cid = `vid-${Date.now()}`;
        const isPreviewEnabled = showPreview || (document.getElementById("cfg-preview") && document.getElementById("cfg-preview").checked);

        const items = sources.map((s) => {
          const startMin = Math.floor(s.start / 60);
          const startSec = String(Math.floor(s.start % 60)).padStart(2, "0");
          const endMin = Math.floor(s.end / 60);
          const endSec = String(Math.floor(s.end % 60)).padStart(2, "0");
          const timeRange = `${startMin}:${startSec} - ${endMin}:${endSec}`;

          // Clean title boilerplate
          let cleanTitle = s.title.replace(/\s*[\uff5c|?]\s*Python\s+Tutorial.*$/i, "").trim();
          cleanTitle = cleanTitle.replace(/\s+in\s+Python\b/i, "").trim();

          const snippetHTML = isPreviewEnabled && s.text ? `<div class="video-snippet-box">"${escapeHTML(s.text)}"</div>` : "";

          return `
            <div class="video-lecture-card">
              <div class="video-card-top">
                <div class="video-title-group">
                  <span class="mod-badge">Module ${s.video_number}</span>
                  <span class="mod-title">${escapeHTML(cleanTitle)}</span>
                </div>
                <span class="match-tag">${Math.round(s.score * 100)}% Match</span>
              </div>
              <div class="video-time-row">
                <span class="time-chip">&#9654; ${timeRange}</span>
                <span>(${Math.max(1, Math.round(s.end - s.start))}s clip)</span>
              </div>
              ${snippetHTML}
            </div>
          `;
        }).join("");

        citationsHTML = `
          <div class="video-panel-wrapper open" id="${cid}-wrap">
            <div class="video-panel-header" onclick="toggleVideoPanel('${cid}-wrap')">
              <div class="video-header-left">
                <span class="video-play-badge">&#9654;</span>
                <span class="video-header-title">Related Video Lectures</span>
                <span class="video-header-count">${sources.length} Clips</span>
              </div>
              <span class="video-toggle-indicator">&#9660;</span>
            </div>
            <div class="video-cards-list" id="${cid}">${items}</div>
          </div>
        `;
      }

      return `
        <div class="message-row ${role}">
          <div class="avatar-icon">${avatar}</div>
          <div class="message-body">
            <div class="message-bubble">${formatted}</div>
            ${role === "bot" ? citationsHTML : ""}
            <div class="meta-timestamp">${timestamp}</div>
          </div>
        </div>
      `;
    }

    function toggleVideoPanel(wrapId) {
      const wrap = document.getElementById(wrapId);
      if (wrap) wrap.classList.toggle("open");
    }

    function toggleCitations(id, btn) {
      const container = document.getElementById(id);
      if (container) container.classList.toggle("expanded");
    }

    function autoScrollToBottom() {
      const viewport = document.getElementById("chat-viewport");
      requestAnimationFrame(() => {
        viewport.scrollTop = viewport.scrollHeight;
      });
    }

    function handleKeyNavigation(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitQuery();
      }
    }

    function bindInputDynamicResize(textarea) {
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, 120)}px`;
      });
    }

    function escapeHTML(str) {
      const p = document.createElement("p");
      p.textContent = str;
      return p.innerHTML;
    }
  </script>
</body>
</html>
